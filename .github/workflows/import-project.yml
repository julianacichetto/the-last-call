name: Import The Last Call project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-project:
    if: github.event.head_commit.message == 'Add project import workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download project archive
        run: |
          curl --fail --location --retry 3 --output /tmp/the-last-call-project.zip 'https://d2ol7oe51mr4n9.cloudfront.net/user_32vMnQWY6kifoJfCULT3q08Mvcy/a7032615-7e2b-4e61-b1be-9380a23c34f4.zip'
          unzip -t /tmp/the-last-call-project.zip
      - name: Extract project files
        run: |
          mkdir -p app
          unzip -q /tmp/the-last-call-project.zip -d app
          test -f app/package.json
          test -f app/src/routes/index.tsx
      - name: Commit project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Import The Last Call website project'
          git push
